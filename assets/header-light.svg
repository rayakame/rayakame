<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="rayakame — MAGI system boot sequence">
  <title>rayakame — MAGI SYS</title>
  <style>
    /*VARS*/
    :root{
      --bg:#F4F1E8; --panel:#EAE5D6; --ink:#1C1A16; --muted:#6E6759;
      --acc:#F26B1F; --accink:#B34700; --red:#A00009; --amber:#8A5A00;
      --grn:#0E7C3A; --dim:#1C1A1626; --scan:#00000012;
    }
    /*ENDVARS*/
    .mono{font-family:'JetBrains Mono','Cascadia Code','Fira Code',Menlo,Consolas,'DejaVu Sans Mono',monospace}
    .bgc{fill:var(--bg)}
    .ink{fill:var(--ink)}
    .mut{fill:var(--muted)}
    .accf{fill:var(--acc)}
    .acct{fill:var(--accink)}
    .redf{fill:var(--red)}
    .ambf{fill:var(--amber)}
    .grnf{fill:var(--grn)}
    .pgrid{fill:none;stroke:var(--dim);stroke-width:1}
    .slc{fill:var(--scan)}
    .frame{fill:none;stroke:var(--acc);opacity:.35}
    .brk{fill:none;stroke:var(--acc);stroke-width:3}
    .gridf{opacity:0;--fo:1;animation:kfade .9s ease .55s forwards}
    .hexmain{fill:none;stroke:var(--acc);stroke-width:2.5;stroke-dasharray:400;stroke-dashoffset:400;animation:kdraw 1.1s ease-out .4s forwards}
    .hexin{fill:none;stroke:var(--acc);opacity:0;--fo:.25;animation:kfade .6s ease .9s forwards}
    .ring1{fill:none;stroke:var(--acc);opacity:0;--fo:.55;animation:kfade .8s ease .7s forwards}
    .ring2{fill:none;stroke:var(--red);opacity:0;--fo:.4;animation:kfade .8s ease .9s forwards}
    .mgram{fill:none;stroke:var(--acc);stroke-width:6.5;stroke-linejoin:miter;opacity:0;animation:kfade .5s ease 1.3s forwards}
    .tick{fill:var(--acc);opacity:0;--fo:.8;animation:kfade .3s ease 1.5s forwards}
    .hx{fill:none;stroke:var(--acc);stroke-width:1.5;opacity:0}
    .hx1{animation:kon .01s steps(1,end) .50s forwards,khxp 5s ease-in-out 2.4s infinite}
    .hx2{animation:kon .01s steps(1,end) .62s forwards,khxp 5s ease-in-out 2.7s infinite}
    .hx3{animation:kon .01s steps(1,end) .74s forwards,khxp 5s ease-in-out 3.0s infinite}
    .hx4{animation:kon .01s steps(1,end) .86s forwards,khxp 5s ease-in-out 3.3s infinite}
    .hx5{animation:kon .01s steps(1,end) .98s forwards,khxp 5s ease-in-out 3.6s infinite}
    .hx6{animation:kon .01s steps(1,end) 1.10s forwards,khxp 5s ease-in-out 3.9s infinite}
    .hx7{animation:kon .01s steps(1,end) 1.22s forwards,khxp 5s ease-in-out 4.2s infinite}
    .hx8{animation:kon .01s steps(1,end) 1.34s forwards,khxp 5s ease-in-out 4.5s infinite}
    .L{opacity:0}
    .L0{animation:kon .01s steps(1,end) 0.90s forwards}
    .L1{animation:kon .01s steps(1,end) 1.04s forwards}
    .L2{animation:kon .01s steps(1,end) 1.18s forwards}
    .L3{animation:kon .01s steps(1,end) 1.32s forwards}
    .L4{animation:kon .01s steps(1,end) 1.46s forwards}
    .L5{animation:kon .01s steps(1,end) 1.60s forwards}
    .L6{animation:kon .01s steps(1,end) 1.74s forwards}
    .L7{animation:kon .01s steps(1,end) 1.88s forwards}
    .gl1{opacity:0;fill:var(--red);animation:kg1 6.5s linear 2.1s infinite}
    .gl2{opacity:0;fill:var(--grn);animation:kg2 6.5s linear 2.1s infinite}
    .ul{fill:var(--acc);opacity:0;animation:kon .01s steps(1,end) 2.05s forwards}
    .r1{opacity:0;animation:kon .01s steps(1,end) 2.3s forwards}
    .r2{opacity:0;animation:kon .01s steps(1,end) 2.8s forwards}
    .r3{opacity:0;animation:kon .01s steps(1,end) 3.3s forwards}
    .blink{animation:kblink 1.1s steps(1,end) infinite}
    .bso{animation:kbsoft 2.4s ease-in-out infinite}
    .nd{opacity:0}
    .nd1{animation:kon .01s steps(1,end) 1.5s forwards}
    .nd2{animation:kon .01s steps(1,end) 1.7s forwards}
    .nd3{animation:kon .01s steps(1,end) 1.9s forwards}
    .cline{stroke:var(--acc);stroke-width:1;fill:none;opacity:0;--fo:.5;animation:kfade .4s ease 2s forwards}
    .pnl{fill:var(--panel);stroke:var(--acc);stroke-width:1.2}
    .dot{fill:var(--grn);animation:kpulse 1.6s ease-in-out infinite}
    .d2{animation-delay:.5s}
    .d3{animation-delay:1s}
    .stx{animation:kbsoft 2.8s ease-in-out infinite}
    .verd{opacity:0;animation:kon .01s steps(1,end) 4.2s forwards}
    @keyframes kon{to{opacity:1}}
    @keyframes kfade{to{opacity:var(--fo,1)}}
    @keyframes kdraw{to{stroke-dashoffset:0}}
    @keyframes kblink{0%{opacity:1}55%{opacity:0}100%{opacity:1}}
    @keyframes kbsoft{0%,100%{opacity:.95}50%{opacity:.3}}
    @keyframes kpulse{0%,100%{opacity:.25}50%{opacity:1}}
    @keyframes khxp{0%,100%{opacity:.55}50%{opacity:1}}
    @keyframes kg1{0%{opacity:0}1%{opacity:.75}2.2%{opacity:0}55%{opacity:0}55.8%{opacity:.6}56.6%{opacity:0}100%{opacity:0}}
    @keyframes kg2{0%{opacity:0}0.6%{opacity:.6}1.8%{opacity:0}55.3%{opacity:0}56%{opacity:.55}57%{opacity:0}100%{opacity:0}}
  </style>
  <defs>
    <path id="bh" d="M0,-8 L6.93,-4 L6.93,4 L0,8 L-6.93,4 L-6.93,-4 Z"/>
    <pattern id="hexpat" x="0" y="0" width="56" height="64" patternUnits="userSpaceOnUse">
      <path class="pgrid" d="M14,4 L24.4,10 L24.4,22 L14,28 L3.6,22 L3.6,10 Z"/>
      <path class="pgrid" d="M42,36 L52.4,42 L52.4,54 L42,60 L31.6,54 L31.6,42 Z"/>
    </pattern>
    <pattern id="slpat" x="0" y="0" width="3" height="3" patternUnits="userSpaceOnUse">
      <rect class="slc" x="0" y="0" width="3" height="1"/>
    </pattern>
    <pattern id="haz" x="0" y="273" width="36" height="18" patternUnits="userSpaceOnUse">
      <polygon fill="#F26B1F" points="0,18 18,0 27,0 9,18"/>
      <polygon fill="#B0000A" points="18,18 36,0 45,0 27,18"/>
      <polygon fill="#B0000A" points="-18,18 0,0 9,0 -9,18"/>
    </pattern>
    <linearGradient id="swp" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F26B1F" stop-opacity="0"/>
      <stop offset=".5" stop-color="#F26B1F" stop-opacity=".16"/>
      <stop offset="1" stop-color="#F26B1F" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="hazclip">
      <rect x="9" y="273" width="1182" height="17"/>
    </clipPath>
  </defs>

  <rect class="bgc" x="0" y="0" width="1200" height="300"/>

  <g transform="translate(0,150)">
    <g>
      <animateTransform attributeName="transform" type="scale" values="1 0.004;1 1.02;1 1" keyTimes="0;0.8;1" dur="0.55s" fill="freeze"/>
      <g transform="translate(0,-150)">

        <rect class="gridf" x="0" y="0" width="1200" height="300" fill="url(#hexpat)"/>

        <rect class="frame" x="8" y="8" width="1184" height="284" stroke-width="1"/>
        <path class="brk" d="M8,36 L8,8 L36,8"/>
        <path class="brk" d="M1164,8 L1192,8 L1192,36"/>
        <path class="brk" d="M8,264 L8,292 L36,292"/>
        <path class="brk" d="M1192,264 L1192,292 L1164,292"/>

        <text class="mono mut" x="28" y="30" font-size="11" letter-spacing="2">MAGI SYS // TACTICAL DISPLAY // PROFILE.OS v5.27</text>
        <text class="mono ambf bso" x="1170" y="30" font-size="11" letter-spacing="2" text-anchor="end">[ ORDER A-801 :: ACTIVE ]</text>

        <use xlink:href="#bh" x="304" y="60" class="hx hx1"/>
        <use xlink:href="#bh" x="352" y="60" class="hx hx2"/>
        <use xlink:href="#bh" x="400" y="60" class="hx hx3"/>
        <use xlink:href="#bh" x="448" y="60" class="hx hx4"/>
        <use xlink:href="#bh" x="496" y="60" class="hx hx5"/>
        <use xlink:href="#bh" x="544" y="60" class="hx hx6"/>
        <use xlink:href="#bh" x="592" y="60" class="hx hx7"/>
        <use xlink:href="#bh" x="640" y="60" class="hx hx8"/>

        <g>
          <circle class="ring1" cx="145" cy="152" r="84" stroke-width="1.5" stroke-dasharray="10 6">
            <animateTransform attributeName="transform" type="rotate" from="0 145 152" to="360 145 152" dur="26s" repeatCount="indefinite"/>
          </circle>
          <circle class="ring2" cx="145" cy="152" r="92" stroke-width="1" stroke-dasharray="2 14">
            <animateTransform attributeName="transform" type="rotate" from="360 145 152" to="0 145 152" dur="40s" repeatCount="indefinite"/>
          </circle>
          <polygon class="hexmain" points="145,86 202.2,119 202.2,185 145,218 87.8,185 87.8,119"/>
          <polygon class="hexin" points="145,96 193.5,124 193.5,180 145,208 96.5,180 96.5,124" stroke-width="1"/>
          <path class="mgram" d="M127,120 L127,184 M127,120 L159,120 L167,132 L167,148 L159,160 L127,160 M145,160 L169,184"/>
          <circle class="tick" cx="145" cy="78" r="2"/>
          <circle class="tick" cx="145" cy="226" r="2"/>
          <circle class="tick" cx="209.1" cy="115" r="2"/>
          <circle class="tick" cx="209.1" cy="189" r="2"/>
          <circle class="tick" cx="80.9" cy="115" r="2"/>
          <circle class="tick" cx="80.9" cy="189" r="2"/>
          <text class="mono mut r1" x="145" y="262" font-size="10" letter-spacing="3" text-anchor="middle">R·KAME // OPS</text>
        </g>

        <g class="mono ink" font-size="92" font-weight="700">
          <text class="gl1" x="300" y="168" transform="translate(3,-2)" textLength="448" lengthAdjust="spacingAndGlyphs">rayakame</text>
          <text class="gl2" x="300" y="168" transform="translate(-3,2)" textLength="448" lengthAdjust="spacingAndGlyphs">rayakame</text>
          <text class="L L0" x="300" y="168">r</text>
          <text class="L L1" x="356" y="168">a</text>
          <text class="L L2" x="412" y="168">y</text>
          <text class="L L3" x="468" y="168">a</text>
          <text class="L L4" x="524" y="168">k</text>
          <text class="L L5" x="580" y="168">a</text>
          <text class="L L6" x="636" y="168">m</text>
          <text class="L L7" x="692" y="168">e</text>
        </g>
        <rect class="ul" x="300" y="192" width="448" height="3"/>

        <g class="r1">
          <text class="mono ink" x="300" y="218" font-size="13" letter-spacing="1">&gt; MAGI.BOOT :: NODES [3/3] :: CONSENSUS — <tspan class="grnf">OK</tspan></text>
        </g>
        <g class="r2">
          <text class="mono ink" x="300" y="240" font-size="13" letter-spacing="1">&gt; PATTERN <tspan class="acct" font-weight="700">ORANGE</tspan> // IDENT "RAYAKAME" // <tspan class="ambf">TUM.INFORMATIK</tspan> // MUC.DE</text>
        </g>
        <g class="r3">
          <text class="mono ink" x="300" y="262" font-size="13" letter-spacing="1">&gt; SYNC.RATE</text>
          <rect x="400" y="251" width="180" height="11" fill="none" stroke="#F26B1F" opacity=".8" stroke-width="1"/>
          <rect class="accf" x="402" y="253" width="0" height="7">
            <animate attributeName="width" from="0" to="167" begin="3.8s" dur="1.4s" fill="freeze"/>
          </rect>
          <text class="mono acct" x="592" y="262" font-size="13">98.2%</text>
          <rect class="accf blink" x="646" y="251" width="9" height="13"/>
        </g>

        <text class="mono mut nd nd1" x="1000" y="66" font-size="11" letter-spacing="3" text-anchor="middle">MAGI CONSENSUS</text>
        <path class="cline" d="M1000,116 L908,180 M1000,116 L1092,180 M978,199 L1022,199"/>
        <g class="nd nd1">
          <rect class="pnl" x="930" y="78" width="140" height="38" rx="2"/>
          <circle class="dot" cx="942" cy="89" r="3"/>
          <text class="mono ink" x="1000" y="94" font-size="11" letter-spacing="1" text-anchor="middle">MELCHIOR·1</text>
          <text class="mono grnf stx" x="1000" y="108" font-size="8" letter-spacing="2" text-anchor="middle">NOMINAL</text>
        </g>
        <g class="nd nd2">
          <rect class="pnl" x="838" y="180" width="140" height="38" rx="2"/>
          <circle class="dot d2" cx="850" cy="191" r="3"/>
          <text class="mono ink" x="908" y="196" font-size="11" letter-spacing="1" text-anchor="middle">BALTHASAR·2</text>
          <text class="mono grnf stx" x="908" y="210" font-size="8" letter-spacing="2" text-anchor="middle">NOMINAL</text>
        </g>
        <g class="nd nd3">
          <rect class="pnl" x="1022" y="180" width="140" height="38" rx="2"/>
          <circle class="dot d3" cx="1034" cy="191" r="3"/>
          <text class="mono ink" x="1092" y="196" font-size="11" letter-spacing="1" text-anchor="middle">CASPER·3</text>
          <text class="mono grnf stx" x="1092" y="210" font-size="8" letter-spacing="2" text-anchor="middle">NOMINAL</text>
        </g>
        <text class="mono mut verd" x="1000" y="248" font-size="11" letter-spacing="1" text-anchor="middle">DELIBERATION COMPLETE — 3/3 <tspan class="grnf" font-weight="700">GRANTED</tspan></text>

        <g clip-path="url(#hazclip)">
          <g>
            <animateTransform attributeName="transform" type="translate" from="0 0" to="36 0" dur="2.5s" repeatCount="indefinite"/>
            <rect x="-72" y="273" width="1344" height="17" fill="url(#haz)" opacity=".85"/>
          </g>
        </g>
        <rect class="bgc" x="470" y="272" width="260" height="19"/>
        <text class="mono ambf" x="600" y="285" font-size="10" letter-spacing="2" text-anchor="middle">CAUTION :: LIVE ENVIRONMENT</text>

        <rect x="0" y="0" width="1200" height="300" fill="url(#slpat)" pointer-events="none"/>
        <g>
          <animateTransform attributeName="transform" type="translate" from="0 0" to="1520 0" begin="1.2s" dur="7s" repeatCount="indefinite"/>
          <rect x="-160" y="0" width="140" height="300" fill="url(#swp)"/>
        </g>

      </g>
    </g>
  </g>

  <rect class="accf" x="0" y="0" width="1200" height="300" opacity=".5" pointer-events="none">
    <animate attributeName="opacity" values=".5;0" dur=".4s" fill="freeze"/>
  </rect>
</svg>
